<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Scalency OS</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6f4e;
      --border: #e4e4e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card: #1c1c1c;
        --text: #f2f2f2;
        --muted: #a0a0a0;
        --accent: #5fb98a;
        --border: #2c2c2c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 4px 12px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
    }
    h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Coming soon</span>
    <h1>Scalency OS</h1>
    <p>The internal platform for Scalency's marketing, sales and delivery is being built.</p>
  </main>
</body>
</html>

# Netlify settings for the scalency-os project (os.scalency.us): build and serve the app in platform/.
# The public landing site (scalency.us) is a separate Netlify project and uses landing/netlify.toml.

[build]
  # The Next.js app lives in platform/. Netlify detects Next.js and serves it with its Next.js runtime.
  base = "platform"
  command = "npm run build"
  publish = ".next"

# Use Netlify's Next.js runtime explicitly so pages and logins are served by it.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "26"

[[headers]]
  for = "/*"
  [headers.values]
    # Standard browser safety settings.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
